<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單查詢 - 妮妮小舖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="top-nav">
        <button class="icon-btn" onclick="location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
        <div class="logo">nini order <span>search</span></div>
    </header>

    <main class="main-content">
        <section class="search-section">
            <div class="search-container">
                <h2 class="search-title">訂單查詢</h2>
                <div class="search-form-card">
                    <div class="input-group">
                        <label for="community-name"><i class="fas fa-users"></i> 社群名稱</label>
                        <input type="text" id="community-name" placeholder="請輸入社群名稱">
                    </div>
                    <div class="input-group">
                        <label for="phone-number"><i class="fas fa-mobile-alt"></i> 手機號碼</label>
                        <input type="tel" id="phone-number" placeholder="請輸入手機號碼">
                    </div>
                        <button type="button" id="submit-query" class="btn-primary">
                            <i class="fas fa-magic"></i> 開始查詢
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="result-section" class="result-section" style="display: none;">
            <div id="filter-bar" class="filter-bar">
                <label class="filter-chip all-chip">
                    <input type="checkbox" id="filter-all" checked>
                    <span>全部</span>
                </label>
                <label class="filter-chip" data-status="已完成"><input type="checkbox" class="filter-status" value="已完成" checked><span>已完成</span></label>
                <label class="filter-chip" data-status="已出貨"><input type="checkbox" class="filter-status" value="已出貨" checked><span>已出貨</span></label>
                <label class="filter-chip" data-status="已抵台"><input type="checkbox" class="filter-status" value="已抵台" checked><span>已抵台</span></label>
                <label class="filter-chip" data-status="運回中"><input type="checkbox" class="filter-status" value="運回中" checked><span>運回中</span></label>
                <label class="filter-chip" data-status="已購入"><input type="checkbox" class="filter-status" value="已購入" checked><span>已購入</span></label>
                <label class="filter-chip" data-status="待採買"><input type="checkbox" class="filter-status" value="待採買" checked><span>待採買</span></label>
                <label class="filter-chip" data-status="已取消"><input type="checkbox" class="filter-status" value="已取消" checked><span>已取消</span></label>
            </div>
            <div class="section-title">✦ 我的訂單紀錄</div>
            <div id="cards-container" class="cards-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
